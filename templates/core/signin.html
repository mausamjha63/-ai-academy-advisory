{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | AI Academic Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-overlay"></div>
        
        <nav class="auth-nav">
            <div class="nav-brand-text" style="color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">
                <span class="nav-brand-title" style="color: white;">AI Academic Advisor</span>
                <span class="nav-brand-subtitle">VIDYASHILP UNIVERSITY</span>
            </div>
            <a href="{% url 'landing' %}" class="auth-back">Back to Home</a>
        </nav>

        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your dashboard.</p>
            
            <form id="dummySignInForm">
                <div class="auth-form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" required placeholder="name@domain.com">
                </div>
                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; border-radius: var(--radius-md);">Sign In</button>
            </form>
            
            <div class="auth-disclaimer">
                Demo experience — no account is actually verified or accessed.
            </div>
            
            <div class="auth-switch">
                Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('dummySignInForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = "{% url 'dashboard' %}";
        });
    </script>
</body>
</html>
